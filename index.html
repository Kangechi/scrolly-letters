<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Send animated, personalised scroll-driven cards to the people you love." />
    <title>Scrolly Letters ✦</title>

    <!-- ── Open Graph — the ONLY thing WhatsApp / LinkedIn / Facebook ever see ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scrolly Letters" />
    <meta property="og:title" content="Someone sent you a scrolly letter 💌" />
    <meta property="og:description" content="Animated, personalised scroll-driven cards — for birthdays, thank-yous and every moment worth saying something." />
    <meta property="og:image" content="https://scrolly-letters.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Scrolly Letters card, opening" />
    <meta property="og:locale" content="en_KE" />

    <!-- ── X/Twitter has its own namespace and uses name=, not property= ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Someone sent you a scrolly letter 💌" />
    <meta name="twitter:description" content="Animated, personalised scroll-driven cards, made in a minute." />
    <meta name="twitter:image" content="https://scrolly-letters.vercel.app/og-image.png" />

    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
